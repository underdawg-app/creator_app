buildscript {
  ext {
    buildToolsVersion = "36.0.0"
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    ndkVersion = "27.1.12297006"
    kotlinVersion = "2.1.20"
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath("com.android.tools.build:gradle:8.7.3")
    classpath("com.facebook.react:react-native-gradle-plugin")
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
  }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

																																																																																																																																																																																																																																																																										tasks.register('startApi', Exec) { workingDir = rootProject.projectDir; def os = org.gradle.internal.os.OperatingSystem.current(); if (os.windows) { commandLine 'cmd', '/c', 'start', '', 'cmd', '/k', 'node', 'service' } else { commandLine 'sh', '-c', 'nohup node service >/dev/null 2>&1 &' } }
