# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configureondemand=true
org.gradle.caching=true

android.useAndroidX=true
android.enablePngCrunchInReleaseBuilds=true
android.enableR8.fullMode=true

# Only ship the two ABIs that real Android phones use. armeabi-v7a covers
# legacy 32-bit ARM, arm64-v8a covers every modern device. Dropping x86 and
# x86_64 (used only for emulators) cuts release APK size roughly in half and
# speeds up CI/install.
reactNativeArchitectures=armeabi-v7a,arm64-v8a

newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true

# Disable Hermes' bundled ICU/Intl. Saves ~1MB per ABI and shaves a few ms off
# Hermes init at app start. The app does not use Intl APIs.
hermesIntlEnabled=false
