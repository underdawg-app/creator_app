apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

react {
    autolinkLibrariesWithApp()
}

// Release builds run R8 in full mode + resource shrinking. This drops the
// release APK from ~70MB to ~30MB and speeds up class loading at app start
// (smaller DEX = faster cold launch on Android).
def enableProguardInReleaseBuilds = true
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Resolve duplicate androidsvg classes: react-native-svg pulls
// `com.caverock:androidsvg` (jar) and @d11/react-native-fast-image pulls
// `com.caverock:androidsvg-aar` (aar). Same classes, different packaging.
// Drop the jar variant; keep the aar so FastImage's SVG module works.
configurations.all {
    exclude group: 'com.caverock', module: 'androidsvg'
    // react-native-video targets androidx.media3 1.8.0, but transitive
    // constraints upgrade it to 1.9.0, mixing ExoPlayer internals and crashing
    // with NoSuchMethodError (DefaultLoadControl/DefaultAllocator). Pin every
    // media3 module to one consistent version.
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'androidx.media3') {
            details.useVersion '1.8.0'
        }
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.underdawgs.app'
    defaultConfig {
        applicationId 'com.underdawgs.app'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
        // Strip translations we don't ship; keep all density buckets so the
        // mdpi/hdpi/xhdpi splash drawables shipped with bootsplash still
        // resolve at runtime.
        resourceConfigurations += ['en']
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            crunchPngs true
            // Hermes-friendly resource handling (no debug symbols).
            ndk {
                debugSymbolLevel 'NONE'
            }
        }
    }
    packagingOptions {
        jniLibs {
            // Modern Android (API 23+) loads .so files straight from the APK
            // without copying to /data — saves install time and disk.
            useLegacyPackaging false
        }
        resources {
            excludes += [
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/*.kotlin_module',
            ]
        }
    }
    bundle {
        language { enableSplit = true }
        density  { enableSplit = true }
        abi      { enableSplit = true }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
